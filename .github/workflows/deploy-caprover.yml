name: Deploy alifcrptoai to CapRover

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-bot:
    name: Deploy Python Trading Bot Engine
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy Bot to CapRover
        uses: caprover/deploy-from-github@v2
        with:
          server: ${{ secrets.CAPROVER_SERVER }}
          app: 'alifcrptoai-bot'
          token: ${{ secrets.BOT_APP_TOKEN }}
          working-directory: 'bot'

  deploy-dashboard:
    name: Deploy Next.js Command Center Dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy Dashboard to CapRover
        uses: caprover/deploy-from-github@v2
        with:
          server: ${{ secrets.CAPROVER_SERVER }}
          app: 'alifcrptoai-dashboard'
          token: ${{ secrets.DASHBOARD_APP_TOKEN }}
          working-directory: 'dashboard'
